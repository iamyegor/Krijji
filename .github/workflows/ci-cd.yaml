name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HELM_COMMAND: helm upgrade krijji ./krijji-k8s --values krijji-k8s/values.yaml
  CR_REPO: jasonstathamdev/currency-converter

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./krijji-client
            dockerfile: ./krijji-client/Dockerfile
            tag: frontend
          - name: backend
            context: ./krijji-server/Krijji/app
            dockerfile: ./krijji-server/Krijji/app/Dockerfile
            tag: backend
          - name: backend-migrator
            context: ./krijji-server/Krijji
            dockerfile: ./krijji-server/Krijji/migrator/Dockerfile
            tag: backend-migrator

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ env.CR_REPO }}:${{ matrix.tag }}
          cache-from: type=registry,ref=${{ env.CR_REPO }}:${{ matrix.tag }}-cache
          cache-to: type=registry,ref=${{ env.CR_REPO }}:${{ matrix.tag }}-cache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          ssh root@${{ secrets.SERVER_IP }} "${{ env.HELM_COMMAND }}"
